<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AurexVideo</title>
<link rel="stylesheet" href="/assets/fonts/inter.css" />
<style>
:root{--bg:#181818;--panel:#222;--text:#eee;--accent:#ff6a00}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#111;border-bottom:1px solid #2a2a2a}
header h1{font-size:18px;margin:0;letter-spacing:.08em}
header nav a{color:#ccc;margin-left:14px;text-decoration:none;font-size:13px}
header nav a:hover{color:#fff}
main{max-width:1100px;margin:0 auto;padding:22px}
.card{background:var(--panel);border:1px solid #2a2a2a;border-radius:12px;padding:16px;margin:14px 0}
</style>
</head>
<body>
<header>
  <h1>AUREXVIDEO</h1>
  <nav>
    <a href="/">Trang chủ</a>
    <a href="/app">Editor</a>
    <a href="/settings">Cài đặt</a>
  </nav>
</header>
<main>
  <div class="card">
    <h2>Bộ máy render</h2>
    <p>Engine: <code>engine/</code> | Port: <code>8899</code> | Decks: <code>decks/</code></p>
  </div>
  <div class="card">
    <h2>Dự án của bạn</h2>
    <p id="projects">Đang tải…</p>
  </div>
</main>
<script>
fetch('/api/projects').then(r=>r.json()).then(d=>{
  const el=document.getElementById('projects');
  const list=(d.projects||[]).map(p=>`<div><a href='/project/${p.name}'>${p.title||p.name}</a></div>`).join('') || '<i>Chưa có dự án</i>';
  el.innerHTML=list;
});
</script>
</body>
</html>
