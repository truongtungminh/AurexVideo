<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>AurexVideo Watch</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,sans-serif}
video{width:100vw;height:100vh;object-fit:contain;background:#000}
.toolbar{position:fixed;top:10px;left:10px;display:flex;gap:8px}
a{color:#ff6a00;background:#111;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="toolbar">
  <a href="/">← Quay lại</a>
  <a href="/app">✎ Sửa</a>
</div>
<video id="v" controls autoplay></video>
<script>
const v=document.getElementById('v');
const params=new URLSearchParams(location.search);
const name=params.get('project');
if(name){ v.src='/video?project='+encodeURIComponent(name); }
</script>
</body>
</html>
