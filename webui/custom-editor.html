<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor · Custom</title><link rel="stylesheet" href="/webui/styles.css" />
  <style>
    .custom-shell{max-width:1500px;margin:0 auto;padding:22px;display:grid;grid-template-columns:minmax(340px,.7fr) minmax(460px,1fr);gap:20px}.custom-preview{position:sticky;top:16px;height:calc(100vh - 42px);min-height:640px}.custom-preview iframe{width:100%;height:calc(100% - 70px);border:0;border-radius:20px;background:#111}.custom-editor-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.custom-slides{display:grid;gap:14px;margin-top:16px}.custom-slide{padding:16px;border:1px solid var(--line,#ddd);border-radius:16px;background:var(--panel,#fff)}.custom-slide header{display:flex;gap:10px;align-items:center;justify-content:space-between}.custom-slide label{display:grid;gap:6px;margin-top:10px;font-weight:700}.custom-slide textarea,.custom-slide input,.custom-slide select{width:100%;padding:10px;border:1px solid var(--line,#ccc);border-radius:10px;font:inherit}.custom-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.custom-image-row{display:flex;gap:10px;align-items:center}.custom-image-row img{width:82px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line,#ddd)}.custom-status{font-size:13px;color:var(--muted,#666)}@media(max-width:900px){.custom-shell{grid-template-columns:1fr}.custom-preview{position:relative;top:auto;height:560px}}
  </style>
</head>
<body class="editor-page"><header class="topbar editor-topbar"><div class="editor-brand-group"><a class="editor-brand" href="/"><img src="/web/aurexvideo-logo.png" alt="" /><strong>Aurex</strong></a><a class="editor-projects-link" href="/">← Tất cả dự án</a></div><div class="editor-title"><strong id="title">Custom</strong><span id="status">Đang tải…</span></div><button class="button primary" id="render" type="button">Render MP4</button></header><main class="custom-shell"><section class="custom-preview panel"><div class="custom-editor-head"><div><p class="eyebrow">Preview</p><strong>Slide đang chọn</strong></div><span id="previewCount"></span></div><iframe id="preview" title="Preview Custom"></iframe></section><section class="panel"><div class="custom-editor-head"><div><p class="eyebrow">Custom</p><h1>Slides & kịch bản</h1></div><button class="button secondary" id="addSlide" type="button">＋ Thêm slide</button></div><label>Kịch bản — mỗi dòng là một nhịp đọc<textarea id="script" rows="7" placeholder="Nhập một câu mỗi dòng"></textarea></label><p class="custom-status">Timing tự chia lại khi số dòng thay đổi. Mọi chỉnh sửa tự động lưu.</p><div class="custom-slides" id="slides"></div></section></main><script src="/webui/custom-editor.js"></script></body>
</html>
