      - textbox "Enter one sentence or spoken beat per line…" [ref=e142]: Đây là UTC. Còn đây là GMT. Sự khác nhau là gì? UTC là chuẩn thời gian quốc tế được đo bằng đồng hồ nguyên tử, nên luôn chính xác và không phụ thuộc vào vòng quay của Trái Đất. GMT là múi giờ dựa trên thời gian Mặt Trời trung bình tại Đài thiên văn Greenwich, nên có thể lệch nhẹ vì Trái Đất quay không đều. Năm 1972, thế giới chính thức dùng UTC thay cho GMT làm chuẩn thời gian chung, vì đồng hồ nguyên tử chính xác hơn Trái Đất tự quay. Ngày nay, UTC là chuẩn thời gian mà máy tính, internet và ngành hàng không trên toàn thế giới đều dựa vào. Trong đời sống hàng ngày, GMT vẫn là tên múi giờ chính thức ở Anh và một số nước Tây Âu vào mùa đông. Còn bạn, mỗi lần xem giờ trên điện thoại, bạn nghĩ mình đang dùng UTC hay GMT? Comment câu trả lời bên dưới nhé.
      - paragraph [ref=e143]: Keep the same line count to preserve timing. Adding or removing lines recalculates timing on autosave.
