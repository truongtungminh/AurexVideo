<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Người dẫn chuyện - One Scene Video</title>
    <link rel="stylesheet" href="style.css?v=20260903-quiz-answer-1" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" id="stage" aria-label="Video so sánh một cảnh">
        <div class="stage-background" id="stageBackground" aria-hidden="true">
          <img id="stageBackgroundImage" alt="" hidden />
        </div>
        <div class="stage-intro" id="stageIntro" aria-label="Intro mở đầu, nửa dưới khung hình" aria-hidden="true" hidden>
          <img id="stageIntroImage" alt="" hidden />
          <video id="stageIntroVideo" muted playsinline loop preload="auto" hidden></video>
          <div class="stage-intro-wash" aria-hidden="true"></div>
          <div class="stage-intro-copy">
            <img id="stageIntroLogo" alt="" hidden />
            <p id="stageIntroTitle"></p>
          </div>
        </div>
        <div class="slide-canvas" id="slideCanvas" aria-label="Custom slide" hidden></div>
        <div class="topic-label-stack topic-label-left">
          <div class="topic-label" id="leftLabel">Inox 304</div>
          <div class="topic-sub-label" id="leftSubLabel" hidden></div>
        </div>
        <div class="topic-label-stack topic-label-right">
          <div class="topic-label" id="rightLabel">Inox 316</div>
          <div class="topic-sub-label" id="rightSubLabel" hidden></div>
        </div>

        <div class="media-slot media-slot-left">
          <img id="leftImage" alt="Hình minh họa đối tượng bên trái" />
        </div>
        <div class="media-slot media-slot-right">
          <img id="rightImage" alt="Hình minh họa đối tượng bên phải" />
        </div>

        <div class="karaoke" id="karaoke" aria-live="polite"></div>
        <div class="quiz-text" id="quizText" aria-live="polite" hidden>
          <div class="quiz-question" id="quizQuestion"></div>
          <div class="quiz-countdown" id="quizCountdown"></div>
          <div class="quiz-answer" id="quizAnswer"></div>
        </div>

        <div class="teacher-wrap" id="teacherWrap">
          <img class="teacher" id="teacher" alt="Nhân vật đang trình bày" />
        </div>

        <div class="loading" id="loading">Đang chuẩn bị bài giảng...</div>
        <div class="sync-marker" id="syncMarker" aria-hidden="true"></div>
      </section>

      <div class="controls" id="controls">
        <button type="button" id="playButton">Phát</button>
        <button type="button" id="restartButton">Xem lại</button>
        <span id="timeText">00:00 / 00:00</span>
        <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Tiến trình video" />
      </div>
    </main>

    <audio id="voiceover" preload="auto"></audio>
    <audio id="backgroundMusic" preload="auto" loop></audio>
    <script src="app.js?v=20260903-quiz-answer-1"></script>
  </body>
</html>
